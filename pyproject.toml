[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "booker-qa"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = ["httpx==0.28.1", "jsonschema==4.17.3"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "pytest-xdist==3.8.0", "allure-pytest==2.16.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --allure-no-capture"
junit_family = "legacy"
markers = ["live: public API tests, enabled with --live", "business_gap: strict enterprise expectations unsupported by the sandbox"]
